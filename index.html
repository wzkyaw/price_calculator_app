<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Myanmar Retail Price Calculator</title>

<!-- Inline SVG App Icon -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%231d6ff2'/%3E%3Crect x='105' y='95' width='302' height='322' rx='38' fill='white'/%3E%3Crect x='140' y='135' width='232' height='72' rx='15' fill='%23eaf2ff'/%3E%3Ctext x='256' y='184' text-anchor='middle' font-family='Arial' font-size='45' font-weight='bold' fill='%231d6ff2'%3E₭%3C/text%3E%3Cg fill='%231d6ff2'%3E%3Crect x='145' y='235' width='62' height='48' rx='10'/%3E%3Crect x='225' y='235' width='62' height='48' rx='10'/%3E%3Crect x='305' y='235' width='62' height='48' rx='10'/%3E%3Crect x='145' y='300' width='62' height='48' rx='10'/%3E%3Crect x='225' y='300' width='62' height='48' rx='10'/%3E%3Crect x='305' y='300' width='62' height='48' rx='10'/%3E%3C/g%3E%3C/svg%3E">

<style>
* {
    box-sizing: border-box;
}

html {
    -webkit-text-size-adjust: 100%;
}

body {
    margin: 0;
    padding: 16px;
    background: #f4f7fb;
    color: #172033;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Myanmar",
        "Myanmar Text",
        Arial,
        sans-serif;
}

.app {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
}

/* Header */
.header {
    text-align: center;
    margin: 8px 0 18px;
}

.icon {
    width: 54px;
    height: 54px;
    margin: 0 auto 10px;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 8px 22px rgba(29,111,242,.18);
}

.icon svg {
    width: 100%;
    height: 100%;
    display: block;
}

h1 {
    margin: 0;
    font-size: 24px;
    line-height: 1.3;
    font-weight: 800;
}

.subtitle {
    margin: 6px 0 0;
    color: #687386;
    font-size: 13px;
}

/* Card */
.card {
    background: #fff;
    border: 1px solid #e1e6ef;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 8px 28px rgba(20,35,60,.06);
}

/* Input */
.label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 700;
}

.input-wrap {
    position: relative;
}

.cost-input {
    width: 100%;
    height: 52px;
    padding: 0 15px;
    border: 1.5px solid #d5dce7;
    border-radius: 12px;
    background: #fff;
    color: #172033;
    font-size: 17px;
    font-weight: 700;
    outline: none;
    transition: .2s;
}

.cost-input:focus {
    border-color: #1d6ff2;
    box-shadow: 0 0 0 3px rgba(29,111,242,.10);
}

/* Native search clear button only */
.cost-input::-webkit-search-cancel-button {
    cursor: pointer;
}

/* Result */
.result {
    margin-top: 18px;
}

.result-title {
    margin-bottom: 10px;
    font-size: 15px;
    font-weight: 800;
}

/* Table */
.table-wrap {
    width: 100%;
    overflow: hidden;
    border: 1px solid #e1e6ef;
    border-radius: 12px;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

thead {
    background: #f1f5fb;
}

th,
td {
    padding: 11px 5px;
    text-align: center;
    vertical-align: middle;
    border-bottom: 1px solid #e8edf4;

    /* Phone-friendly */
    font-size: 11px;
    line-height: 1.25;

    white-space: nowrap;
}

th {
    color: #566176;
    font-weight: 800;
}

td {
    color: #202b3c;
    font-weight: 600;
}

tbody tr:last-child td {
    border-bottom: none;
}

.qty {
    font-weight: 800;
    color: #1d6ff2;
}

.price {
    color: #087443;
    font-weight: 900;
}

.profit {
    color: #b05a00;
    font-weight: 800;
}

/* Empty state */
.empty {
    text-align: center;
    padding: 28px 12px;
    color: #8993a4;
    font-size: 13px;
}

/* Info */
.info {
    margin-top: 14px;
    padding: 12px;
    border-radius: 10px;
    background: #f6f8fc;
    color: #687386;
    font-size: 11px;
    line-height: 1.6;
}

/* Smaller phones */
@media (max-width: 380px) {

    body {
        padding: 10px;
    }

    .card {
        padding: 13px;
        border-radius: 13px;
    }

    h1 {
        font-size: 21px;
    }

    .subtitle {
        font-size: 11px;
    }

    .cost-input {
        height: 48px;
        font-size: 16px;
    }

    th,
    td {
        padding: 9px 2px;
        font-size: 9px;
    }

    .result-title {
        font-size: 13px;
    }
}

/* Very small screens */
@media (max-width: 330px) {

    body {
        padding: 7px;
    }

    .card {
        padding: 10px;
    }

    th,
    td {
        padding: 8px 1px;
        font-size: 8px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">

        <h3>Retail Price Calculator</h3>

    </div>


    <div class="card">

        <label class="label" for="costInput">
            100 လုံး Cost Price (MMK)
        </label>

        <!-- Native clear button only -->
        <div class="input-wrap">
            <input
                id="costInput"
                class="cost-input"
                type="search"
                inputmode="numeric"
                autocomplete="off"
                placeholder="ဥပမာ - 38000"
                aria-label="100 လုံး Cost Price"
            >
        </div>


        <div class="result">

            <div class="result-title">
                Retail Price Result
            </div>

            <div id="resultArea">

                <div class="empty">
                    Cost Price ထည့်ပါ
                </div>

            </div>

        </div>


        <div class="info">
            <strong>Pricing Logic</strong><br>
            10 လုံး = Base Markup + 10%<br>
            1 လုံး = Base Markup + 15%<br>
            Selling Price ကို MMK denomination အတိုင်း အပေါ်တက် Round ပြုလုပ်ထားသည်။
        </div>

    </div>

</div>


<script>

/* =========================================
   PRICING SETTINGS
   ========================================= */

const costInput = document.getElementById("costInput");
const resultArea = document.getElementById("resultArea");


/*
   Base Markup
   100 လုံး Cost Price ပေါ်မူတည်ပြီး
   Base Markup သတ်မှတ်သည်။
*/
function getBaseMarkup(cost100) {

    if (cost100 <= 3000) {
        return 35;
    }

    if (cost100 <= 5000) {
        return 32;
    }

    if (cost100 <= 10000) {
        return 28;
    }

    if (cost100 <= 20000) {
        return 25;
    }

    if (cost100 <= 30000) {
        return 23;
    }

    if (cost100 <= 50000) {
        return 20;
    }

    if (cost100 <= 100000) {
        return 18;
    }

    return 15;
}


/*
   MMK rounding
*/
function getRoundStep(price) {

    if (price < 1000) {
        return 50;
    }

    if (price < 5000) {
        return 100;
    }

    if (price < 10000) {
        return 200;
    }

    if (price < 50000) {
        return 500;
    }

    if (price < 100000) {
        return 1000;
    }

    if (price < 500000) {
        return 5000;
    }

    return 10000;
}


/*
   Round selling price upward
*/
function roundMMK(price) {

    const step = getRoundStep(price);

    return Math.ceil(price / step) * step;
}


/*
   Number formatting
*/
function money(number) {

    return Math.round(number).toLocaleString("en-US");
}


/*
   Main calculation
*/
function calculate() {

    /*
       Remove commas and everything
       except numbers
    */
    const raw = costInput.value
        .replace(/,/g, "")
        .replace(/[^\d]/g, "");

    const cost100 = Number(raw);


    /*
       Empty / invalid
    */
    if (!cost100 || cost100 <= 0) {

        resultArea.innerHTML = `
            <div class="empty">
                Cost Price ထည့်ပါ
            </div>
        `;

        return;
    }


    /*
       Base markup
    */
    const baseMarkup = getBaseMarkup(cost100);


    /*
       ONLY 10 + 1
    */
    const quantities = [
        {
            qty: 10,
            extraMarkup: 10
        },
        {
            qty: 1,
            extraMarkup: 15
        }
    ];


    let rows = "";


    quantities.forEach(item => {

        /*
           Cost per quantity
        */
        const quantityCost =
            cost100 / 100 * item.qty;


        /*
           Retail markup
        */
        const markup =
            baseMarkup + item.extraMarkup;


        /*
           Raw selling price
        */
        const rawSelling =
            quantityCost * (1 + markup / 100);


        /*
           Rounded retail price
        */
        const sellingPrice =
            roundMMK(rawSelling);


        /*
           Actual profit
        */
        const profit =
            sellingPrice - quantityCost;


        /*
           Actual profit %
           based on cost
        */
        const profitPercent =
            (profit / quantityCost) * 100;


        rows += `
            <tr>

                <td class="qty">
                    ${item.qty} လုံး
                </td>

                <td>
                    ${money(quantityCost)}
                </td>

                <td>
                    ${markup}%
                </td>

                <td class="price">
                    ${money(sellingPrice)}
                </td>

                <td class="profit">
                    ${money(profit)}
                </td>

                <td>
                    ${profitPercent.toFixed(2)}%
                </td>

            </tr>
        `;
    });


    /*
       Result table
    */
    resultArea.innerHTML = `

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>အရေအတွက်</th>
                        <th>Cost</th>
                        <th>Markup</th>
                        <th>ရောင်းဈေး</th>
                        <th>အမြတ်</th>
                        <th>အမြတ် %</th>
                    </tr>
                </thead>

                <tbody>
                    ${rows}
                </tbody>

            </table>

        </div>

    `;
}


/*
   Auto calculate while typing
*/
costInput.addEventListener("input", calculate);


/*
   Also calculate after paste/change
*/
costInput.addEventListener("change", calculate);

</script>

</body>
</html>
